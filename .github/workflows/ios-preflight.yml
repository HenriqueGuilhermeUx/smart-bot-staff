name: iOS simulator preflight (unsigned)

on:
  pull_request:
    paths:
      - 'scripts/prepare-ios.mjs'
      - 'docs/ios/**'
      - '.github/workflows/ios-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies without modifying lockfiles
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Add matching Capacitor iOS dependency in ephemeral runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/ios@8.4.1
      - name: Prepare iOS platform
        run: node scripts/prepare-ios.mjs
      - name: Build unsigned iOS simulator application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/ios-derived" build 2>&1 | tee ios-preflight-build.log
      - name: Launch app on an iPhone simulator (smoke test)
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          DEVICE_ID="$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=Object.values(JSON.parse(s).devices).flat().find(x=>x.isAvailable && x.name.startsWith("iPhone"));if(!d)process.exit(1);console.log(d.udid)})')"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "Testing bundle $BUNDLE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl shutdown "$DEVICE_ID" || true
      - name: Archive unsigned simulator .app for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/ios-derived/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preflight-log
          path: ios-preflight-build.log
          if-no-files-found: ignore
          retention-days: 7
