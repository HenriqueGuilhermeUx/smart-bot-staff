name: Build Staff Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android-debug.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Show tool versions
        run: |
          node --version
          npm --version
          java -version

      - name: Install dependencies cleanly
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm cache clean --force
          npm install --no-audit --no-fund
          npm ls @capacitor/core @capacitor/android @capacitor/local-notifications @capacitor/cli

      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Enable exact reminder scheduling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if permission not in text:
              text = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + permission, text, count=1)
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Staff APK
        uses: actions/upload-artifact@v7
        with:
          name: staff-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
