name: Staff Android Release 2.3.4

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check application
        run: npm run typecheck

      - name: Validate Netlify functions
        run: |
          node --check functions/staff-chat.js
          node --check functions/staff-chat-v2.js
          node --check netlify/functions/staff-chat.js
          node --check netlify/functions/staff-chat-v2.js
          node --check functions/staff-study.js
          npx esbuild netlify/functions/staff-study.mts --platform=node --format=esm --bundle --outfile=/tmp/staff-study.mjs
          npx esbuild netlify/functions/delete-account.mts --platform=node --format=esm --bundle --outfile=/tmp/delete-account.mjs
          npx esbuild functions/delete-account.mts --platform=node --format=esm --bundle --outfile=/tmp/delete-account-legacy.mjs

      - name: Reject legacy Nexa access gate
        run: |
          if grep -R -n -E "Staff Premium é exclusivo|invalid_nexa_token|staff/validate-token|NEXA_API_URL" src functions netlify/functions; then
            echo "::error::Foi encontrada uma regra antiga que condiciona o Staff à Nexa."
            exit 1
          fi
          echo "Nenhum bloqueio de acesso Nexa encontrado."

      - name: Verify recovery flow source
        run: |
          grep -q "resetPasswordForEmail" src/lib/supabase.ts
          grep -q "Esqueci minha senha" src/components/staff/AuthLanding.tsx
          grep -q "PASSWORD_RECOVERY" src/AppV2.tsx
          grep -q "Excluir minha conta em vez disso" src/components/staff/PasswordRecovery.tsx
          echo "Fluxo de recuperação e exclusão verificada presente."

      - name: Validate Supabase configuration
        env:
          VITE_SUPABASE_URL: https://mkwkljnfaqszvcjzhajn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          PUBLIC_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-$VITE_SUPABASE_ANON_KEY}"
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::Cadastre VITE_SUPABASE_PUBLISHABLE_KEY ou VITE_SUPABASE_ANON_KEY."
            exit 1
          fi

          node -e "const u = new URL(process.env.VITE_SUPABASE_URL); if (u.protocol !== 'https:') process.exit(1); console.log('Supabase host:', u.hostname)"

          curl --fail --silent --show-error --max-time 20 \
            "$VITE_SUPABASE_URL/auth/v1/settings" \
            -H "apikey: $PUBLIC_KEY" \
            >/dev/null

          echo "Supabase URL, DNS e Auth endpoint validados."

      - name: Build web application
        env:
          VITE_SUPABASE_URL: https://mkwkljnfaqszvcjzhajn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android assets
          npx cap add android
          npx cap sync android

      - name: Generate Android icon and splash
        run: |
          mkdir -p assets
          cp public/staff-icon.svg assets/logo.svg
          npx @capacitor/assets generate --android --assetPath assets \
            --iconBackgroundColor '#050816' \
            --iconBackgroundColorDark '#050816' \
            --splashBackgroundColor '#050816' \
            --splashBackgroundColorDark '#050816'

      - name: Set Android version
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 30/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "2.3.4"/' android/app/build.gradle

      - name: Verify Android voice permission
        run: |
          grep -R "android.permission.RECORD_AUDIO" android/app/build/intermediates/merged_manifests android/app/src node_modules/@capgo/capacitor-speech-recognition/android/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Build debug APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Sign release AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Cadastre os quatro secrets de assinatura Android."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > staff-upload-key.jks

          jarsigner \
            -keystore staff-upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"

          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: staff-android-debug-2.3.4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Google Play AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: staff-google-play-release-2.3.4
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Staff 2.3 database migration
        uses: actions/upload-artifact@v4
        with:
          name: staff-family-studies-sql-2.3.0
          path: supabase/migrations/20260819_staff_family_studies_v1.sql
          if-no-files-found: error
          retention-days: 30
