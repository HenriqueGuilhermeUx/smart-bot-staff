<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">Staff — organize sua vida falando</title>
  <desc id="desc">Recurso gráfico do Staff com agenda, tarefas, automações e controle por voz.</desc>
  <defs>
